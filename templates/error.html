<!DOCTYPE html>
<html>
<head>
    <title>Error - E-commerce System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 50px;
        }

        .error-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .error-icon {
            font-size: 72px;
            text-align: center;
            margin-bottom: 20px;
        }

        .error-title {
            color: #dc3545;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">
        {% if error_code == 404 %}
        🔍
        {% elif error_code == 500 %}
        ⚠️
        {% else %}
        ❗
        {% endif %}
    </div>
    <h1 class="error-title">
        {% if error_code == 404 %}
        404 - Page Not Found
        {% elif error_code == 500 %}
        500 - Server Error
        {% else %}
        Error {{ error_code }}
        {% endif %}
    </h1>

    <div class="text-center mb-4">
        <p>{{ error_message }}</p>
    </div>

    <div class="text-center">
        <a href="/" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> Return to Homepage
        </a>
        <a href="/products" class="btn btn-outline-secondary btn-lg ms-2">
            <i class="fas fa-box"></i> Browse Products
        </a>
    </div>
</div>
</body>
</html>
